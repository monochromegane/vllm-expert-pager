[project]
name = "vllm-expert-pager"
version = "0.1.1"
description = "vLLM plugin that pages MoE expert weights between VRAM, pinned RAM, and SSD"
readme = "README.md"
license = "MIT"
authors = [
    { name = "monochromegane" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "torch>=2.13.0",
]

[project.entry-points."vllm.general_plugins"]
expert_pager = "vllm_expert_pager.plugin:register"
